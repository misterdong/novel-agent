name: novel-agent

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-novel_agent}
      POSTGRES_USER: ${POSTGRES_USER:-novel_agent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-novel_agent_local}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - novel_agent_postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  novel_agent_postgres_data:
